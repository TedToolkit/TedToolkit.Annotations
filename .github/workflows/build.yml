on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run-build-project:
    if: github.ref != 'refs/heads/main'
    uses: TedToolkit/TedToolkit/.github/workflows/build.yml@2e45980886585f0896c496aaafd38e6d0930d567
    secrets: inherit

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: TedToolkit/TedToolkit/.github/actions/publish-nuget@2e45980886585f0896c496aaafd38e6d0930d567
        env:
          NUGET_API_KEY: ${{ secrets.NUGET__APIKEY }}
          NUGET_SOURCE: ${{ vars.NUGET__SOURCE }}

  release-pr:
    needs: run-build-project
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: TedToolkit/TedToolkit/.github/actions/maintain-release-pr@2e45980886585f0896c496aaafd38e6d0930d567
